server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host:3000$request_uri;
}

server {
    listen 3000 ssl default_server;
    listen [::]:3000 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/ntms.crt;
    ssl_certificate_key /etc/ssl/private/ntms.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/vmadmin/ntms-exam-platform/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
